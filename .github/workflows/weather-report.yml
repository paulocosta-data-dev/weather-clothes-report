name: Weather Clothes Report

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:

  send-report:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t weather-report .

      - name: Run weather report
        run: |
          docker run --rm \
            -e SMTP_SERVER="${{ secrets.SMTP_SERVER }}" \
            -e SMTP_PORT="${{ secrets.SMTP_PORT }}" \
            -e SMTP_USERNAME="${{ secrets.SMTP_USERNAME }}" \
            -e SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
            -e EMAIL_FROM="${{ secrets.EMAIL_FROM }}" \
            -e EMAIL_TO="${{ secrets.EMAIL_TO }}" \
            -e EMAIL_TO_2="${{ secrets.EMAIL_TO_2 }}" \
            weather-report